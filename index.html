const TARGET_LEVELS = 11;
const FINAL_PHOTO = "052e4a344cb333b6f06bb12c08cc702e.jpg";
const RANDOM_POOL = ALL_PHOTOS.filter(f => f !== FINAL_PHOTO);
const fileToImg = {};
let LEVEL_FILES = [];
let LEVELS = 0, MAX_LEVEL = 0, SPAWN_MAX = 5;
let RADII = [];
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pickLevels() {
  return [...shuffle(RANDOM_POOL.slice()).slice(0, TARGET_LEVELS - 1), FINAL_PHOTO];
}
function loadRoundPhotos() {
  for (const file of Object.keys(fileToImg)) {
    if (!LEVEL_FILES.includes(file)) delete fileToImg[file];
  }
  for (const file of LEVEL_FILES) {
    if (fileToImg[file]) continue;
    const im = new Image();
    im.decoding = 'async';
    im.addEventListener('load', drawNext);
    im.src = PHOTO_DIR + file;
    fileToImg[file] = im;
  }
}

function computeRadii() {
  RADII = [];
  let r = 20;
  for (let i = 0; i < LEVELS; i++) { RADII.push(Math.round(r)); r *= 1.17; }
}

// 画布尺寸（逻辑像素）
const W = 420, H = 640;
const WALL = 20;
const DROP_Y = 54;               // 待落水果的悬停高度
const DANGER_Y = 114;            // 死亡线

// ---------- Matter 初始化 ----------
const { Engine, World, Bodies, Body, Composite, Events } = Matter;
const engine = Engine.create();
engine.gravity.y = 1.05;
const world = engine.world;

let fruits = [];          // 当前所有水果 body
let pendingMerges = [];
let currentLevel = randSpawn();
let nextLevel = randSpawn();
let dropX = W / 2;
let canDrop = true;
let score = 0;
let best = Number(localStorage.getItem('watermelon_best') || 0);
let running = false;
let overTimer = 0;
let won = false;

let walls = [];

function buildWalls() {
  const opt = { isStatic: true, render: { visible: false }, friction: 0.4 };
  walls = [
    Bodies.rectangle(W / 2, H + WALL / 2, W + 2 * WALL, WALL, opt),       // 地面
    Bodies.rectangle(-WALL / 2, H / 2, WALL, H * 2, opt),                 // 左墙
    Bodies.rectangle(W + WALL / 2, H / 2, WALL, H * 2, opt)               // 右墙
  ];
  World.add(world, walls);
}

function randSpawn() { return Math.floor(Math.random() * SPAWN_MAX); }

function spawnFruit(x, y, level, isMerge) {
  const r = RADII[level];
  const body = Bodies.circle(x, y, r, {
    restitution: 0.12,
    friction: 0.35,
    frictionStatic: 0.6,
    density: 0.001,
    label: 'fruit'
  });
  body.fruitLevel = level;
  body.merged = false;
  fruits.push(body);
  World.add(world, body);
  return body;
}

// 合成处理
Events.on(engine, 'collisionStart', (e) => {
  for (const pair of e.pairs) {
    const a = pair.bodyA, b = pair.bodyB;
    if (a.label === 'fruit' && b.label === 'fruit' &&
        !a.merged && !b.merged && a.fruitLevel === b.fruitLevel) {
      a.merged = true; b.merged = true;
      pendingMerges.push([a, b]);
    }
  }
});

function processMerges() {
  if (!pendingMerges.length) return;
  for (const [a, b] of pendingMerges) {
    const x = (a.position.x + b.position.x) / 2;
    const y = (a.position.y + b.position.y) / 2;
    const lvl = a.fruitLevel;
    removeFruit(a); removeFruit(b);
    if (lvl < MAX_LEVEL) {
      const nl = lvl + 1;
      spawnFruit(x, y, nl);
      score += (nl) * (nl + 1) / 2;     // 合成越大得分越多
      playMerge(nl);
      if (nl === MAX_LEVEL) celebrate();   // 合成出目标图！
    } else {
      // 两个目标图相遇：消除并给大额奖励
      score += 200;
      playMerge(MAX_LEVEL);
    }
  }
  pendingMerges = [];
  updateScore();
}

function removeFruit(body) {
  const i = fruits.indexOf(body);
  if (i >= 0) fruits.splice(i, 1);
  World.remove(world, body);
}

// ---------- 画布 ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const dpr = Math.min(window.devicePixelRatio || 1, 2);
canvas.width = W * dpr; canvas.height = H * dpr;
ctx.scale(dpr, dpr);

function drawFruitCircle(x, y, r, level, angle) {
  ctx.save();
  ctx.translate(x, y);
  if (angle) ctx.rotate(angle);
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.clip();
  const im = fileToImg[LEVEL_FILES[level]];
  if (im && im.complete && im.naturalWidth) {
    // 等比 cover：保持原图比例，只裁掉超出圆形的部分，不压扁
    const ir = im.naturalWidth / im.naturalHeight;
    let dw, dh;
    if (ir >= 1) { dh = r * 2; dw = dh * ir; } else { dw = r * 2; dh = dw / ir; }
    ctx.drawImage(im, -dw / 2, -dh / 2, dw, dh);
  } else {
    ctx.fillStyle = '#f1c27d';
    ctx.fillRect(-r, -r, r * 2, r * 2);
  }
  ctx.restore();
  // 边框
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(150,90,30,.35)';
  ctx.stroke();
}

function render() {
  ctx.clearRect(0, 0, W, H);

  // 死亡线
  ctx.save();
  ctx.setLineDash([6, 6]);
  ctx.strokeStyle = 'rgba(255,151,187,.68)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(8, DANGER_Y); ctx.lineTo(W - 8, DANGER_Y);
  ctx.stroke();
  ctx.restore();


  // 待落水果 + 引导线
  if (running && canDrop) {
    const r = RADII[currentLevel];
    const cx = Math.max(r, Math.min(W - r, dropX));
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.setLineDash([4, 6]);
    ctx.strokeStyle = 'rgba(155,241,255,.8)';
    ctx.beginPath();
    ctx.moveTo(cx, DROP_Y + r);
    ctx.lineTo(cx, H - 4);
    ctx.stroke();
    ctx.restore();
    // 所有水果
  for (const b of fruits) {
    drawFruitCircle(b.position.x, b.position.y, RADII[b.fruitLevel], b.fruitLevel, b.angle);
  }
    drawFruitCircle(cx, DROP_Y, r, currentLevel, 0);
  } else {
  // 所有水果
  for (const b of fruits) {
    drawFruitCircle(b.position.x, b.position.y, RADII[b.fruitLevel], b.fruitLevel, b.angle);
  }

  }
}

// ---------- 游戏循环 ----------
let lastT = 0, accumulator = 0, gameRAF = null;
const STEP = 1000 / 60;
function loop(t) {
  if (!running) return;
  if (!lastT) lastT = t;
  accumulator += Math.min(100, t - lastT);
  lastT = t;
  while (accumulator >= STEP && running) {
    processMerges();
    if (running) {
      Engine.update(engine, STEP);
      checkGameOver();
    }
    accumulator -= STEP;
  }
  render();
  if (running) gameRAF = requestAnimationFrame(loop);
}

function checkGameOver() {
  let danger = false;
  for (const b of fruits) {
    const r = RADII[b.fruitLevel];
    if (b.position.y - r < DANGER_Y && b.speed < 0.8) { danger = true; break; }
  }
  overTimer = danger ? overTimer + 1 / 60 : 0;
  if (overTimer > 2) gameOver();
}

function gameOver() {
  running = false;
  if (score > best) {
    best = score;
    localStorage.setItem('watermelon_best', String(best));
  }
  document.getElementById('best').textContent = best;
  document.getElementById('finalScore').textContent = score;
  document.getElementById('overlay').style.display = 'flex';
}

// ---------- 音效（Web Audio 合成，无需音频文件） ----------
let audioCtx = null;
let soundOn = true;
function resumeAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq, dur, type, vol) {
  if (!soundOn) return;
  resumeAudio();
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(vol || 0.2, t + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + dur);
}
function playDrop() { tone(180, 0.18, 'sine', 0.25); }                 // 落子：低沉“咚”
function playMerge(level) {                                            // 合成：音高随等级升高
  const base = 300 + level * 45;
  tone(base, 0.12, 'triangle', 0.22);
  setTimeout(() => tone(base * 1.5, 0.14, 'triangle', 0.18), 60);
}

// ---------- 庆祝弹窗 + 彩带 ----------
function celebrate() {
  if (won) return;
  won = true;
  running = false;   // 停止物理循环，专注庆祝
  const photo = fileToImg[LEVEL_FILES[MAX_LEVEL]];
  const wimg = document.getElementById('winPhoto');
  wimg.src = (photo && photo.src) || '';
  document.getElementById('winOverlay').style.display = 'flex';
  launchConfetti();
}
let confettiRAF = null;
function launchConfetti() {
  const cv = document.getElementById('confetti');
  cv.width = window.innerWidth; cv.height = window.innerHeight;
  const c = cv.getContext('2d');
  const colors = ['#8ec6f2', '#b3dcff', '#d9ecff', '#ffffff', '#ffd9a3', '#a8e0e8'];
  const parts = [];
  for (let i = 0; i < 160; i++) {
    parts.push({
      x: Math.random() * cv.width,
      y: Math.random() * -cv.height,
      w: 6 + Math.random() * 6, h: 10 + Math.random() * 8,
      vy: 2 + Math.random() * 4, vx: -2 + Math.random() * 4,
      rot: Math.random() * Math.PI, vr: -0.2 + Math.random() * 0.4,
      color: colors[(Math.random() * colors.length) | 0]
    });
  }
  const start = performance.now();
  cancelAnimationFrame(confettiRAF);
  function frame(now) {
    c.clearRect(0, 0, cv.width, cv.height);
    let alive = false;
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      if (p.y < cv.height + 20) alive = true;
      c.save();
      c.translate(p.x, p.y); c.rotate(p.rot);
      c.fillStyle = p.color;
      c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      c.restore();
    }
    if (alive && (now - start < 4000 || document.getElementById('winOverlay').style.display !== 'none')) {
      confettiRAF = requestAnimationFrame(frame);
    } else {
      c.clearRect(0, 0, cv.width, cv.height);
    }
  }
  confettiRAF = requestAnimationFrame(frame);
}

// ---------- 操作 ----------
function doDrop() {
  if (!running || !canDrop) return;
  const r = RADII[currentLevel];
  const cx = Math.max(r, Math.min(W - r, dropX));
  spawnFruit(cx, DROP_Y, currentLevel);
  playDrop();
  canDrop = false;
  currentLevel = nextLevel;
  nextLevel = randSpawn();
  drawNext();
  setTimeout(() => { canDrop = true; }, 420);
}

function pointerX(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  return (clientX - rect.left) * (W / rect.width);
}

canvas.addEventListener('mousemove', e => { dropX = pointerX(e); });
canvas.addEventListener('mousedown', e => { dropX = pointerX(e); doDrop(); });
canvas.addEventListener('touchmove', e => { e.preventDefault(); dropX = pointerX(e); }, { passive: false });
canvas.addEventListener('touchstart', e => { e.preventDefault(); dropX = pointerX(e); }, { passive: false });
canvas.addEventListener('touchend', e => { e.preventDefault(); doDrop(); }, { passive: false });
window.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); doDrop(); } });

// 下一个预览
const nextCanvas = document.getElementById('next');
const nctx = nextCanvas.getContext('2d');
function drawNext() {
  nctx.clearRect(0, 0, 46, 46);
  const r = 21;
  const im = fileToImg[LEVEL_FILES[nextLevel]];
  nctx.save();
  nctx.beginPath();
  nctx.arc(23, 23, r, 0, Math.PI * 2);
  nctx.clip();
  if (im && im.complete && im.naturalWidth) {
    const ir = im.naturalWidth / im.naturalHeight;
    let dw, dh;
    if (ir >= 1) { dh = r * 2; dw = dh * ir; } else { dw = r * 2; dh = dw / ir; }
    nctx.drawImage(im, 23 - dw / 2, 23 - dh / 2, dw, dh);
  } else { nctx.fillStyle = '#f1c27d'; nctx.fillRect(2, 2, 42, 42); }
  nctx.restore();
}

function updateScore() {
  document.getElementById('score').textContent = score;
}

// ---------- 开始 / 重开 ----------
function startGame() {
  cancelAnimationFrame(gameRAF);
  lastT = 0; accumulator = 0;
  World.clear(world, false);
  fruits = [];
  pendingMerges = [];
  score = 0;
  overTimer = 0;
  won = false;
  LEVEL_FILES = pickLevels();
  loadRoundPhotos();
  LEVELS = LEVEL_FILES.length;
  MAX_LEVEL = LEVELS - 1;
  SPAWN_MAX = Math.min(5, LEVELS);
  computeRadii();
  canDrop = true;
  currentLevel = randSpawn();
  nextLevel = randSpawn();
  buildWalls();
  updateScore();
  document.getElementById('best').textContent = best;
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('winOverlay').style.display = 'none';
  drawNext();
  running = true;
  gameRAF = requestAnimationFrame(loop);
}

document.getElementById('restart').addEventListener('click', startGame);

// 图片加载完成后刷新「下一个」预览
Object.values(fileToImg).forEach(im => {
  if (!im.complete) im.addEventListener('load', drawNext);
});

// ---------- 音效控制按钮 ----------
const soundBtn = document.getElementById('soundBtn');
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  soundBtn.textContent = soundOn ? '音效 ON' : '音效 OFF';
  soundBtn.setAttribute('aria-pressed', String(soundOn));
  if (soundOn) resumeAudio();
});

// ---------- 胜利弹窗按钮 ----------
document.getElementById('winRestart').addEventListener('click', startGame);

startGame();

// Console controls use the original drop action; mouse, touch and space still work.
document.getElementById('dropButton').addEventListener('click', doDrop);
function moveAim(delta) {
  const r = RADII[currentLevel];
  dropX = Math.max(r, Math.min(W - r, dropX + delta));
}
document.getElementById('moveLeft').addEventListener('click', () => moveAim(-24));
document.getElementById('moveRight').addEventListener('click', () => moveAim(24));
window.addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') {
    e.preventDefault(); moveAim(e.code === 'ArrowLeft' ? -24 : 24);
  }
});
